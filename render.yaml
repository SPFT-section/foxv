version: "1"
services:
- type: web
  name: foxv
  env: node
  plan: free
  repo: https://github.com/SPFT-section/foxv
  branch: main
  autoDeploy: yes
  rootDir: .
  buildCommand: npm install
  startCommand: node server.js
  healthCheckPath: /health
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: foxv-db
      property: connectionString
databases:
- name: foxv-db
  databaseName: foxv_db_jvba
  user: foxv_db_jvba_user
  plan: free
  region: oregon
  ipAllowList:
  - source: 0.0.0.0/0
    description: everywhere
