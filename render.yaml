  #   rootDir: .
  #   buildCommand: npm install
  #   startCommand: node server.js
  #   healthCheckPath: /health
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: foxv-db
  #         property: connectionString

  - type: web
    name: foxv-site
    runtime: static
    rootDir: public
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
