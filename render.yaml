databases:
  - name: foxv-db
    plan: free

services:
  - type: web
    name: foxv-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foxv-db
          property: connectionString

  - type: static
    name: foxv-site
    plan: free
    rootDir: public
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
